name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            ticketing-api/*.gradle*
            ticketing-api/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            predictor/requirements.txt
            predictor/requirements-test.txt

      - name: Install predictor dependencies
        run: |
          python -m venv predictor/.venv
          predictor/.venv/bin/python -m pip install -r predictor/requirements-test.txt

      - name: Run verification
        run: ./scripts/verify.sh
